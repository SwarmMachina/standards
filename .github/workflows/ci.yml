name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm pack --dry-run
